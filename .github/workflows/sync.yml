name: Auto Sync Upstream

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight UTC
  workflow_dispatch: # Allows you to trigger the sync manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the workflow permissions to push changes to your repo
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pull changes from upstream
        run: |
          # Add the original repository as a remote named 'upstream'
          git remote add upstream https://github.com/reactive-resume/reactive-resume.git
          
          # Fetch upstream branches
          git fetch upstream
          
          # Merge changes into your main branch (change 'main' to 'master' if needed)
          git checkout main
          git merge upstream/main --allow-unrelated-histories
          
          # Push the updated branch back to your repository
          git push origin main
